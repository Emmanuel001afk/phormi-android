name: Validate browser and keyboard

on:
  push:
    branches: ['arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: phormi-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Android resources and DOM adapter
        run: |
          python3 tools/validate_resources.py
          node --test tools/tests/*.test.mjs
      - name: Build, regression tests and Android lint (no publishing)
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee /tmp/phormi-validation.log
          python3 tools/summarize_tests.py
      - name: Annotate build/test diagnostics
        if: failure()
        run: python3 tools/report_validation.py /tmp/phormi-validation.log
      - name: Upload validation reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phormi-validation
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*

  emulator:
    needs: android
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Real IME integration on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/run_emulator_smoke.sh
      - name: Annotate emulator diagnostics
        if: failure()
        run: |
          if [ -f /tmp/phormi-smoke.log ]; then python3 tools/report_validation.py /tmp/phormi-smoke.log; fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phormi-emulator-smoke
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/smoke/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
