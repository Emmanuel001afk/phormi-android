name: Build Phormi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Round 5 WebView state restoration
        run: python3 tools/apply_round5_state_restore.py

      - name: Apply compile repairs
        run: python3 tools/repair_compile.py

      - name: Commit generated source repairs
        run: |
          if git diff --quiet; then
            echo "Source repairs already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/uong/phormi/MainActivity.kt app/src/main/java/com/uong/phormi/PhormiKeyboardService.kt
          git commit -m "Fix browser and keyboard compilation"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phormi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
