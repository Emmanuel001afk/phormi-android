name: Build Phormi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Show Gradle version
        run: gradle --version
      - name: Patch browser download runtime for build
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/uong/phormi/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          start = text.find('    private fun startDownload(')
          end = text.find('    private fun downloadBlobUrl(', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate startDownload boundaries')

          replacement = '''    private fun startDownload(url: String, contentDisposition: String?, mimeType: String?) {
          if (url.isBlank()) {
              Toast.makeText(this, "Cannot download this link", Toast.LENGTH_SHORT).show()
              return
          }

          if (url.startsWith("blob:", ignoreCase = true)) {
              downloadBlobUrl(url, contentDisposition, mimeType)
              return
          }

          if (url.startsWith("data:", ignoreCase = true)) {
              downloadDataUrl(url, contentDisposition, mimeType)
              return
          }

          try {
              val webView = activeWebView()
              val userAgent = webView?.settings?.userAgentString
                  ?: WebSettings.getDefaultUserAgent(this)
              val referer = webView?.url?.takeIf { it.isNotBlank() } ?: url
              val cookies = CookieManager.getInstance().getCookie(url)
                  ?: CookieManager.getInstance().getCookie(referer)
              val info = PhormiDownloadSupport.resolve(
                  url, contentDisposition, mimeType, userAgent, referer, cookies
              )
              val downloadId = PhormiDownloadService.enqueue(this, info)
              Toast.makeText(this, "Download started: ${info.fileName}", Toast.LENGTH_SHORT).show()
              android.util.Log.d("PhormiDownload", "Enqueued download $downloadId: ${info.fileName}")
          } catch (e: Exception) {
              Toast.makeText(this, "Download failed: ${e.message ?: "unknown error"}", Toast.LENGTH_LONG).show()
          }
      }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('MainActivity.startDownload() patched for this build')
      - name: Android lint
        run: |
          set +e
          gradle lintDebug --no-daemon --stacktrace
          status=$?
          echo "===== FULL LINT TEXT REPORT ====="
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
          echo "===== END FULL LINT TEXT REPORT ====="
          exit $status
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Package committed source and APK
        run: |
          mkdir -p dist/phormi-android
          cp -R app dist/phormi-android/
          cp -R .github dist/phormi-android/
          cp -R tools dist/phormi-android/ 2>/dev/null || true
          cp -R docs dist/phormi-android/ 2>/dev/null || true
          cp -R shared dist/phormi-android/ 2>/dev/null || true
          cp build.gradle.kts settings.gradle.kts gradle.properties dist/phormi-android/ 2>/dev/null || true
          cp FINAL_FILE_MAP.txt dist/phormi-android/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk dist/phormi-android/phormi-debug.apk
          cd dist
          zip -qr phormi-final-project.zip phormi-android
          sha256sum phormi-final-project.zip > phormi-final-project.sha256
      - name: Upload final project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: phormi-final-project
          path: |
            dist/phormi-final-project.zip
            dist/phormi-final-project.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phormi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
