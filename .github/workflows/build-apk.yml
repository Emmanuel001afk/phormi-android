name: Build Phormi APK

on:
  push:
    branches:
      - main
      - round12-keyboard-completion-multilingual
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Show Gradle version
        run: gradle --version
      - name: Android lint
        run: |
          set +e
          gradle lintDebug --no-daemon --stacktrace
          status=$?
          echo "===== FULL LINT TEXT REPORT ====="
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
          echo "===== END FULL LINT TEXT REPORT ====="
          exit $status
      - name: Set monotonic Android version
        id: version
        run: |
          set -euo pipefail
          version_code="$(date +%s)"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.$version_code" >> "$GITHUB_OUTPUT"
      - name: Configure persistent release signing
        env:
          PHORMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.PHORMI_RELEASE_KEYSTORE_BASE64 }}
          PHORMI_KEYSTORE_PASSWORD: ${{ secrets.PHORMI_KEYSTORE_PASSWORD }}
          PHORMI_KEY_ALIAS: ${{ secrets.PHORMI_KEY_ALIAS }}
          PHORMI_KEY_PASSWORD: ${{ secrets.PHORMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PHORMI_RELEASE_KEYSTORE_BASE64" || { echo "Missing PHORMI_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$PHORMI_KEYSTORE_PASSWORD" || { echo "Missing PHORMI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$PHORMI_KEY_ALIAS" || { echo "Missing PHORMI_KEY_ALIAS"; exit 1; }
          test -n "$PHORMI_KEY_PASSWORD" || { echo "Missing PHORMI_KEY_PASSWORD"; exit 1; }
          printf '%s' "$PHORMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phormi-release.keystore"
          test -s "$RUNNER_TEMP/phormi-release.keystore"
          {
            echo "PHORMI_KEYSTORE_PATH=$RUNNER_TEMP/phormi-release.keystore"
            echo "PHORMI_KEYSTORE_PASSWORD=$PHORMI_KEYSTORE_PASSWORD"
            echo "PHORMI_KEY_ALIAS=$PHORMI_KEY_ALIAS"
            echo "PHORMI_KEY_PASSWORD=$PHORMI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          PHORMI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PHORMI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK output
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Package committed source and APK
        run: |
          mkdir -p dist/phormi-android
          cp -R app dist/phormi-android/
          cp -R .github dist/phormi-android/
          cp -R tools dist/phormi-android/ 2>/dev/null || true
          cp -R docs dist/phormi-android/ 2>/dev/null || true
          cp -R shared dist/phormi-android/ 2>/dev/null || true
          cp build.gradle.kts settings.gradle.kts gradle.properties dist/phormi-android/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk dist/phormi-android/phormi-release.apk
          cd dist
          zip -qr phormi-final-project.zip phormi-android
          sha256sum phormi-final-project.zip > phormi-final-project.sha256
      - name: Upload final project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: phormi-final-project
          path: |
            dist/phormi-final-project.zip
            dist/phormi-final-project.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phormi-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish latest release to AEM Store
        env:
          APK: app/build/outputs/apk/release/app-release.apk
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
        run: |
          set -euo pipefail
          test -n "$SUPABASE_KEY"
          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          signing_cert="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$signing_cert"
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          app_name="$(sed -n "s/.*application-label='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          size_bytes="$(stat -c '%s' "$APK")"
          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          source_release_id="github-actions-${{ github.run_id }}"
          meta="$(jq -n --arg action prepare --arg repo "Emmanuel001afk/phormi-android" --argjson run_id "${{ github.run_id }}" --arg filename "app-release.apk" --arg application_name "$app_name" --arg version_name "$version_name" --argjson version_code "$version_code" --arg channel stable --arg package_identity "$package" --arg title "Phormi Browser APK" --arg source_release_id "$source_release_id" --arg signing_certificate_sha256 "$signing_cert" '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256}')"
          prepare="$(curl -fsS -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -H "x-github-token: ${{ github.token }}" --data "$meta")"
          upload_url="$(jq -er '.upload_url' <<<"$prepare")"
          object_path="$(jq -er '.path // .Key' <<<"$prepare")"
          curl -fsS -X PUT "$upload_url" -H "Content-Type: application/vnd.android.package-archive" -H "Content-Length: $size_bytes" -H "x-upsert: true" --upload-file "$APK"
          finalize="$(jq -n --arg action finalize --arg repo "Emmanuel001afk/phormi-android" --argjson run_id "${{ github.run_id }}" --arg filename "app-release.apk" --arg application_name "$app_name" --arg version_name "$version_name" --argjson version_code "$version_code" --arg channel stable --arg package_identity "$package" --arg title "Phormi Browser APK" --arg source_release_id "$source_release_id" --arg signing_certificate_sha256 "$signing_cert" --arg object_path "$object_path" --arg path "$object_path" --argjson size_bytes "$size_bytes" --arg sha256 "$sha256" '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256,object_path:$object_path,path:$path,size_bytes:$size_bytes,sha256:$sha256}')"
          curl -fsS -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -H "x-github-token: ${{ github.token }}" --data "$finalize"
