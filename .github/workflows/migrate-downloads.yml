name: One-time browser download migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire MainActivity into PhormiDownloadService
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/uong/phormi/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.find('    private fun startDownload(')
          end = s.find('    private fun downloadBlobUrl(', start)
          if start < 0 or end < 0:
              raise SystemExit('startDownload boundaries not found')
          new_fn = '''    private fun startDownload(url: String, contentDisposition: String?, mimeType: String?) {
        if (url.isBlank()) {
            Toast.makeText(this, "Cannot download this link", Toast.LENGTH_SHORT).show()
            return
        }
        if (url.startsWith("blob:", ignoreCase = true)) {
            downloadBlobUrl(url, contentDisposition, mimeType)
            return
        }
        if (url.startsWith("data:", ignoreCase = true)) {
            downloadDataUrl(url, contentDisposition, mimeType)
            return
        }
        try {
            val webView = activeWebView()
            val userAgent = webView?.settings?.userAgentString
                ?: WebSettings.getDefaultUserAgent(this)
            val referer = webView?.url?.takeIf { it.isNotBlank() } ?: url
            val cookies = CookieManager.getInstance().getCookie(url)
                ?: CookieManager.getInstance().getCookie(referer)
            val info = PhormiDownloadSupport.resolve(
                url, contentDisposition, mimeType, userAgent, referer, cookies
            )
            val downloadId = PhormiDownloadService.enqueue(this, info)
            Toast.makeText(this, "Download started: ${info.fileName}", Toast.LENGTH_SHORT).show()
            android.util.Log.d("PhormiDownload", "Enqueued download $downloadId: ${info.fileName}")
        } catch (e: Exception) {
            Toast.makeText(this, "Download failed: ${e.message ?: "unknown error"}", Toast.LENGTH_LONG).show()
        }
    }

'''
          p.write_text(s[:start] + new_fn + s[end:], encoding='utf-8')
      - name: Verify download wiring
        run: |
          grep -q 'PhormiDownloadService.enqueue(this, info)' app/src/main/java/com/uong/phormi/MainActivity.kt
          ! grep -q '(getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)' app/src/main/java/com/uong/phormi/MainActivity.kt
      - name: Commit source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/uong/phormi/MainActivity.kt
          git rm .github/workflows/migrate-downloads.yml
          git commit -m 'Wire browser downloads into Phormi download manager'
          git push
