name: CI source hotfix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build-blocking lint fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/uong/phormi/MainActivity.kt')
          s = p.read_text()
          needle = '                    if (takeFlags != 0) contentResolver.takePersistableUriPermission(uri, takeFlags)'
          replacement = '                    //noinspection WrongConstant\n' + needle
          if needle in s and replacement not in s:
              s = s.replace(needle, replacement, 1)
              p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/uong/phormi/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: suppress false-positive URI grant lint [skip ci]"
          git push
