name: Android interaction smoke tests
on:
  push:
    branches: [arena/d4887026-phormi-android]
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash -o pipefail -c "gradle connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/phormi-smoke.log"
      - name: Expose test failures
        if: failure()
        run: |
          grep -E '^e: |^> Task .*FAILED|^FAILURE:|^Caused by:' /tmp/phormi-smoke.log | head -30 | while IFS= read -r line; do
            echo "::error title=Android compilation::$line"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  tree = ET.parse(report)
              except ET.ParseError:
                  continue
              for case in tree.iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = (failure.get('message', '') + ' ' + (failure.text or '')[:1800]).replace('\n', '%0A')
                      print(f"::error title={case.get('name')}::{message}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-interaction-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
