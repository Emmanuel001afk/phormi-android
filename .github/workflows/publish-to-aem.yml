name: Publish Phormi APK to AEM

on:
  workflow_run:
    workflows: ["Phormi code quality"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: phormi-aem-publish
  cancel-in-progress: false

jobs:
  publish:
    if: \${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Phormi APK
        uses: actions/download-artifact@v4
        with:
          name: phormi-debug-apk
          path: release
          github-token: \${{ secrets.GITHUB_TOKEN }}
          run-id: \${{ github.event.workflow_run.id }}

      - name: Publish APK to AEM
        env:
          GH_TOKEN: \${{ github.token }}
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          AAPT="$(find "\${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          PACKAGE="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$BADGING")"
          VERSION_CODE="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$BADGING")"
          VERSION_NAME="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$BADGING")"
          APP_NAME="$(sed -n "s/.*application-label='\\([^']*\\)'.*/\\1/p" <<<"$BADGING")"
          SIZE_BYTES="$(stat -c '%s' "$APK")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIGNING_CERT="$(keytool -printcert -jarfile "$APK" | sed -n '/SHA256:/{s/^[[:space:]]*SHA256:[[:space:]]*//;p;q}')"

          test "$PACKAGE" = "com.uong.phormi"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$SIGNING_CERT"

          SOURCE_RELEASE_ID="github-actions-\${{ github.event.workflow_run.id }}"
          FILENAME="$(basename "$APK")"

          META="$(jq -n \
            --arg action "prepare" \
            --arg repo "Emmanuel001afk/phormi-android" \
            --argjson run_id "\${{ github.event.workflow_run.id }}" \
            --arg filename "$FILENAME" \
            --arg application_name "$APP_NAME" \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg channel "stable" \
            --arg package_identity "$PACKAGE" \
            --arg title "Phormi Browser" \
            --arg source_release_id "$SOURCE_RELEASE_ID" \
            --arg signing_certificate_sha256 "$SIGNING_CERT" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256}')"

          PREPARE_RESPONSE="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$PREPARE_RESPONSE" -w '%{http_code}' \
            --connect-timeout 30 --max-time 60 \
            -X POST "$SUPABASE_URL/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-github-token: $GH_TOKEN" \
            --data "$META")"

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            cat "$PREPARE_RESPONSE"
            exit 1
          fi

          UPLOAD_URL="$(jq -er '.upload_url' "$PREPARE_RESPONSE")"
          OBJECT_PATH="$(jq -er '.path // .Key' "$PREPARE_RESPONSE")"

          curl -sS --fail-with-body \
            --connect-timeout 30 --max-time 600 \
            -X PUT "$UPLOAD_URL" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Content-Length: $SIZE_BYTES" \
            -H "x-upsert: true" \
            --upload-file "$APK"

          FINALIZE="$(jq -n \
            --arg action "finalize" \
            --arg repo "Emmanuel001afk/phormi-android" \
            --argjson run_id "\${{ github.event.workflow_run.id }}" \
            --arg filename "$FILENAME" \
            --arg application_name "$APP_NAME" \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg channel "stable" \
            --arg package_identity "$PACKAGE" \
            --arg title "Phormi Browser" \
            --arg source_release_id "$SOURCE_RELEASE_ID" \
            --arg signing_certificate_sha256 "$SIGNING_CERT" \
            --arg object_path "$OBJECT_PATH" \
            --arg path "$OBJECT_PATH" \
            --argjson size_bytes "$SIZE_BYTES" \
            --arg sha256 "$SHA256" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256,object_path:$object_path,path:$path,size_bytes:$size_bytes,sha256:$sha256}')"

          FINALIZE_RESPONSE="$(mktemp)"
          FINALIZE_STATUS="$(curl -sS -o "$FINALIZE_RESPONSE" -w '%{http_code}' \
            --connect-timeout 30 --max-time 120 \
            -X POST "$SUPABASE_URL/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-github-token: $GH_TOKEN" \
            --data "$FINALIZE")"

          cat "$FINALIZE_RESPONSE"
          [[ "$FINALIZE_STATUS" =~ ^2[0-9][0-9]$ ]]
