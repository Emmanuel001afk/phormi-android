name: Phormi code quality

concurrency:
  group: phormi-quality-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Audit source and resources
        run: |
          python3 tools/audit_project.py
          python3 tools/audit_app_icon.py
          python3 tools/audit_app_ui.py
          python3 tools/audit_search.py
          python3 tools/audit_desktop.py
          python3 tools/audit_tabs.py
      - name: Run unit tests
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace > /tmp/phormi-gradle-test.log 2>&1
          result=$?
          cat /tmp/phormi-gradle-test.log
          if [ "$result" -ne 0 ]; then
            # GitHub's downloadable logs may be unavailable to reviewers; expose
            # compiler/dependency/test failures as check annotations as well.
            grep -E '^e: |^> Task .*FAILED|^FAILURE:|^\* What went wrong:|^Could not|^    > |^Caused by:' /tmp/phormi-gradle-test.log | head -60 | while IFS= read -r line; do
              echo "::error title=Gradle test output::$line"
            done
            python3 tools/annotate_test_failures.py
          fi
          exit "$result"
      - name: Build committed source for CodeQL extraction
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Android lint
        run: |
          set +e
          gradle lintDebug --no-daemon --stacktrace > /tmp/phormi-gradle-lint.log 2>&1
          result=$?
          cat /tmp/phormi-gradle-lint.log
          exit "$result"
      # Downloadable job logs are not always available to reviewers. Mirror the
      # lint findings into check annotations so a red build is diagnosable.
      - name: Annotate Android lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          xml_issues, log_lines = [], []
          def add(target, message):
              text = " ".join(str(message).split())
              if text and text not in target:
                  target.append(text)
          # The XML report is precise, so list its errors first.
          for path in glob.glob('app/build/reports/lint-results-debug.xml'):
              root = ET.parse(path).getroot()
              for issue in root.findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      loc = issue.find('location')
                      where = (loc.get('file') if loc is not None else 'app') or 'app'
                      line = (loc.get('line') if loc is not None else '') or '1'
                      add(xml_issues, f"{where}:{line} [{issue.get('id')}] {issue.get('message')}")
          for path in glob.glob('/tmp/phormi-gradle-lint.log'):
              with open(path, errors='replace') as handle:
                  for line in handle:
                      if re.search(r'Error: |Lint found|^\* What went wrong|FAILED', line):
                          add(log_lines, line.strip())
          messages = xml_issues + log_lines
          print(f"::notice title=Android lint::{len(xml_issues)} error(s) in the XML report")
          for message in messages[:10]:
              print("::error title=Android lint::" + message)
          if len(messages) > 10:
              print(f"::error title=Android lint::... and {len(messages) - 10} more finding(s); see the job log.")
          PY
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phormi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  device-smoke:
    name: Tab overview device smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tab and chrome regression tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            gradle connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.uong.phormi.TabOverviewSmokeTest > /tmp/phormi-device-tests.log 2>&1
            result=$?
            echo "GRADLE_RESULT=$result"
            cat /tmp/phormi-device-tests.log
            mkdir -p /tmp/phormi-device-screenshots
            adb pull /sdcard/Android/data/com.uong.phormi/files/tab-overview-list.png /tmp/phormi-device-screenshots/ || true
            adb pull /sdcard/Android/data/com.uong.phormi/files/tab-overview-grid.png /tmp/phormi-device-screenshots/ || true
            echo "SCRIPT_DONE=$result"
            exit "$result"
      - name: Annotate device test failures
        if: failure()
        run: python3 tools/annotate_device_failures.py
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-overview-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/phormi-device-screenshots/
            /tmp/phormi-device-tests.log
          if-no-files-found: ignore
          retention-days: 7
