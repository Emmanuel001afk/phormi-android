name: Phormi code quality

concurrency:
  group: phormi-quality-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Audit source and resources
        run: python3 tools/audit_project.py
      - name: Run unit tests
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace > /tmp/phormi-gradle-test.log 2>&1
          result=$?
          cat /tmp/phormi-gradle-test.log
          if [ "$result" -ne 0 ]; then
            # GitHub's downloadable logs may be unavailable to reviewers; expose
            # compiler/dependency/test failures as check annotations as well.
            grep -E '^e: |^> Task .*FAILED|^FAILURE:|^\* What went wrong:|^Could not|^    > |^Caused by:' /tmp/phormi-gradle-test.log | head -60 | while IFS= read -r line; do
              echo "::error title=Gradle test output::$line"
            done
          fi
          exit "$result"
      - name: Build committed source for CodeQL extraction
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Android lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phormi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Analyze
        uses: github/codeql-action/analyze@v4
