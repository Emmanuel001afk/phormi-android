name: Phormi code quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
      - name: Patch MainActivity download runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/uong/phormi/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.find('    private fun startDownload(')
          end = s.find('    private fun downloadBlobUrl(', start)
          if start < 0 or end < 0:
              raise SystemExit('startDownload boundaries not found')
          new_fn = '''    private fun startDownload(url: String, contentDisposition: String?, mimeType: String?) {
        if (url.isBlank()) {
            Toast.makeText(this, "Cannot download this link", Toast.LENGTH_SHORT).show()
            return
        }
        if (url.startsWith("blob:", ignoreCase = true)) {
            downloadBlobUrl(url, contentDisposition, mimeType)
            return
        }
        if (url.startsWith("data:", ignoreCase = true)) {
            downloadDataUrl(url, contentDisposition, mimeType)
            return
        }
        try {
            val webView = activeWebView()
            val userAgent = webView?.settings?.userAgentString ?: WebSettings.getDefaultUserAgent(this)
            val referer = webView?.url?.takeIf { it.isNotBlank() } ?: url
            val cookies = CookieManager.getInstance().getCookie(url) ?: CookieManager.getInstance().getCookie(referer)
            val info = PhormiDownloadSupport.resolve(url, contentDisposition, mimeType, userAgent, referer, cookies)
            val downloadId = PhormiDownloadService.enqueue(this, info)
            Toast.makeText(this, "Download started: ${info.fileName}", Toast.LENGTH_SHORT).show()
            android.util.Log.d("PhormiDownload", "Enqueued download $downloadId: ${info.fileName}")
        } catch (e: Exception) {
            Toast.makeText(this, "Download failed: ${e.message ?: "unknown error"}", Toast.LENGTH_LONG).show()
        }
    }

'''
          p.write_text(s[:start] + new_fn + s[end:], encoding='utf-8')
      - name: Commit direct download fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/uong/phormi/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'MainActivity already fixed'
          else
            git commit -m 'Fix MainActivity download runtime'
            git push
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build committed source for CodeQL extraction
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v4
